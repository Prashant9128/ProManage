name: ProManage CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  backend:
    name: Backend CI (Node.js & MongoDB Tests)
    runs-on: ubuntu-22.04
    env:
      MONGOMS_VERSION: '7.0.5'
      DEBUG: 'mongodb-memory-server:*'
      JWT_SECRET: 'promanage_super_secret_key_2026'
      JWT_EXPIRE: '7d'
      NODE_ENV: 'development'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install system dependencies for MongoDB Memory Server
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run API integration tests
        run: |
          cd backend
          npm run test

  frontend:
    name: Frontend CI (Vite & TypeScript Build)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend (Typecheck & Vite compile)
        run: |
          cd frontend
          npm run build

  docker:
    name: Docker Build Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
